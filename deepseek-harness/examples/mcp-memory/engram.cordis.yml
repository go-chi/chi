# Opt-in reference for Engram 1.20.0. Install the pinned `engram` executable
# first; storage and project selection remain Engram-owned.
- insert:
    - id: memory-engram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: engram
        transport: stdio
        command: engram
        args: [mcp]
        cwd: !!js process.cwd()
